<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay — 跨仓库提交迁移</title>
  <style>
    :root {
      --bg-deep: #14161a;
      --bg-base: #1c1f26;
      --bg-raised: #252932;
      --bg-hover: #2e333d;
      --bg-active: #363c48;
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.12);
      --text: rgba(255, 255, 255, 0.92);
      --text-secondary: rgba(255, 255, 255, 0.58);
      --text-muted: rgba(255, 255, 255, 0.38);
      --accent: #4ecdc4;
      --accent-dim: rgba(78, 205, 196, 0.15);
      --accent-glow: rgba(78, 205, 196, 0.35);
      --git: #f78166;
      --git-bg: rgba(247, 129, 102, 0.12);
      --svn: #79b8ff;
      --svn-bg: rgba(121, 184, 255, 0.12);
      --add: #3fb950;
      --add-bg: rgba(63, 185, 80, 0.12);
      --mod: #d29922;
      --mod-bg: rgba(210, 153, 34, 0.12);
      --del: #f85149;
      --del-bg: rgba(248, 81, 73, 0.12);
      --warn: #e3b341;
      --warn-bg: rgba(227, 179, 65, 0.14);
      --danger: #f85149;
      --radius: 6px;
      --radius-lg: 10px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      --font: "Segoe UI Variable", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      --mono: "Cascadia Code", "Cascadia Mono", "Consolas", monospace;
      --titlebar-h: 36px;
      --sidebar-w: 220px;
      --repo-panel-w: 260px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, #root {
      height: 100%;
      overflow: hidden;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text);
      background: var(--bg-deep);
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 8px);
      min-height: 480px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      overflow: hidden;
      margin: 4px;
      box-shadow: var(--shadow);
    }

    .titlebar {
      display: flex;
      align-items: center;
      height: var(--titlebar-h);
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      user-select: none;
    }
    .titlebar-drag {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      padding-left: 12px;
      height: 100%;
    }
    .app-logo {
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, var(--accent) 0%, #2a9d8f 100%);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--bg-deep);
    }
    .app-title { font-size: 12px; color: var(--text-secondary); }
    .app-title strong { color: var(--text); font-weight: 600; }
    .win-controls {
      display: flex;
      height: 100%;
    }
    .win-btn {
      width: 46px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: background 0.1s, color 0.1s;
    }
    .win-btn:hover { background: var(--bg-hover); color: var(--text); }
    .win-btn.close:hover { background: #c42b1c; color: #fff; }

    .body {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .step-rail {
      width: var(--sidebar-w);
      background: var(--bg-base);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .step-rail-header {
      padding: 16px 14px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .step-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 0 8px;
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius);
      color: var(--text-secondary);
      transition: background 0.12s, color 0.12s;
      text-align: left;
      width: 100%;
    }
    .step-item:hover:not(:disabled) { background: var(--bg-hover); color: var(--text); }
    .step-item:disabled { opacity: 0.35; cursor: not-allowed; }
    .step-item.active {
      background: var(--accent-dim);
      color: var(--accent);
    }
    .step-item.done { color: var(--text); }
    .step-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
      opacity: 0.7;
    }
    .step-item.active .step-num,
    .step-item.done .step-num {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg-deep);
      opacity: 1;
    }
    .step-item.done .step-num { background: var(--add); border-color: var(--add); }
    .step-label { font-size: 13px; font-weight: 500; }

    .rail-footer {
      margin-top: auto;
      padding: 12px 8px;
      border-top: 1px solid var(--border);
    }
    .rail-footer-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 9px 10px;
      border-radius: var(--radius);
      color: var(--text-secondary);
      transition: background 0.12s;
    }
    .rail-footer-btn:hover { background: var(--bg-hover); color: var(--text); }
    .rail-footer-btn.active { background: var(--bg-raised); color: var(--text); }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--bg-deep);
    }
    .main-screen {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 12px;
      flex-shrink: 0;
    }
    .main-header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .main-header p {
      margin-top: 4px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .main-content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 24px 16px;
      overflow: hidden;
    }
    .main-content--scroll {
      overflow-y: auto;
      display: block;
    }
    .main-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-base);
      flex-shrink: 0;
      z-index: 1;
    }
    .footer-left { color: var(--text-muted); font-size: 12px; }
    .footer-actions { display: flex; gap: 8px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius);
      font-weight: 500;
      transition: background 0.12s, opacity 0.12s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--bg-hover); color: var(--text); }
    .btn-primary {
      background: var(--accent);
      color: var(--bg-deep);
      font-weight: 600;
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-danger {
      background: var(--danger);
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) { filter: brightness(1.1); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .badge-git { background: var(--git-bg); color: var(--git); }
    .badge-svn { background: var(--svn-bg); color: var(--svn); }
    .badge-add { background: var(--add-bg); color: var(--add); }
    .badge-mod { background: var(--mod-bg); color: var(--mod); }
    .badge-del { background: var(--del-bg); color: var(--del); }
    .badge-warn { background: var(--warn-bg); color: var(--warn); }

    .card {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }

    .repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .repo-card {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      text-align: left;
      width: 100%;
    }
    .repo-card:hover { border-color: var(--border-strong); background: var(--bg-raised); }
    .repo-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 0 20px var(--accent-glow);
    }
    .repo-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .repo-card-name { font-weight: 600; font-size: 14px; }
    .repo-card-path {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      word-break: break-all;
    }
    .repo-card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .commit-list { display: flex; flex-direction: column; gap: 4px; }
    .commit-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.1s;
      border: 1px solid transparent;
    }
    .commit-row:hover { background: var(--bg-raised); }
    .commit-row.selected {
      background: var(--accent-dim);
      border-color: rgba(78, 205, 196, 0.25);
    }
    .commit-check {
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--border-strong);
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, border-color 0.1s;
    }
    .commit-row.selected .commit-check {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg-deep);
    }
    .commit-hash {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      flex-shrink: 0;
      width: 72px;
    }
    .commit-msg { font-weight: 500; flex: 1; }
    .commit-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
      font-size: 11px;
      color: var(--text-muted);
    }

    .preview-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }
    .preview-layout > * {
      min-height: 0;
    }
    .file-tree {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: auto;
      min-height: 0;
    }
    .file-tree-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
    }
    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      border-left: 2px solid transparent;
      transition: background 0.1s;
    }
    .file-item:hover { background: var(--bg-hover); }
    .file-item.active {
      background: var(--accent-dim);
      border-left-color: var(--accent);
    }
    .file-item-path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .diff-panel {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .diff-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 12px;
    }
    .diff-body {
      flex: 1;
      overflow: auto;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
    }
    .diff-line {
      display: flex;
      padding: 0 12px;
    }
    .diff-ln {
      width: 40px;
      text-align: right;
      padding-right: 12px;
      color: var(--text-muted);
      user-select: none;
      flex-shrink: 0;
    }
    .diff-ln.old { color: rgba(248, 81, 73, 0.5); }
    .diff-ln.new { color: rgba(63, 185, 80, 0.5); }
    .diff-code { flex: 1; white-space: pre; }
    .diff-line.add { background: rgba(63, 185, 80, 0.08); }
    .diff-line.del { background: rgba(248, 81, 73, 0.08); }
    .diff-line.ctx { color: var(--text-secondary); }
    .diff-line.add .diff-code { color: var(--add); }
    .diff-line.del .diff-code { color: var(--del); }

    .summary-bar {
      display: flex;
      gap: 16px;
      padding: 12px 16px;
      background: var(--bg-raised);
      border-radius: var(--radius);
      flex-shrink: 0;
    }
    .summary-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .summary-stat strong { font-weight: 600; }

    .conflict-banner {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      background: var(--warn-bg);
      border: 1px solid rgba(227, 179, 65, 0.3);
      border-radius: var(--radius-lg);
      flex-shrink: 0;
    }
    .conflict-banner-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: var(--warn);
    }
    .conflict-banner h3 { font-size: 14px; font-weight: 600; color: var(--warn); }
    .conflict-banner p { font-size: 12px; color: var(--text-secondary); margin-top: 4px; line-height: 1.6; }

    .conflict-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      min-height: 0;
    }
    .conflict-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .conflict-item-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .conflict-item-title {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      min-width: 0;
    }
    .conflict-item-title .badge {
      flex-shrink: 0;
      margin-top: 1px;
    }
    .conflict-item-path {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .conflict-item-name {
      color: var(--text);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conflict-item-dir {
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conflict-item-reason {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .conflict-item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-dim); }
    .conflict-item-status {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--add);
    }
    .conflict-item.resolved .conflict-item-status {
      background: var(--add);
      border-color: var(--add);
      color: var(--bg-deep);
    }

    .conflict-workspace {
      display: grid;
      grid-template-columns: minmax(260px, 32%) 1fr;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }
    .conflict-workspace > * {
      min-height: 0;
    }
    .conflict-compare {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }
    .conflict-compare-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .conflict-compare-header span {
      padding: 10px 14px;
      color: var(--text-muted);
    }
    .conflict-compare-header span:first-child {
      border-right: 1px solid var(--border);
      color: var(--del);
    }
    .conflict-compare-header span:last-child { color: var(--add); }
    .conflict-compare-body {
      flex: 1;
      overflow: auto;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.65;
    }
    .conflict-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .conflict-row.chg { background: var(--warn-bg); }
    .conflict-row.add { background: rgba(63, 185, 80, 0.06); }
    .conflict-row.del { background: rgba(248, 81, 73, 0.06); }
    .conflict-cell {
      display: flex;
      padding: 1px 0;
      min-height: 22px;
    }
    .conflict-cell:first-child { border-right: 1px solid var(--border); }
    .conflict-cell.empty { background: rgba(0,0,0,0.15); }
    .conflict-ln {
      width: 36px;
      text-align: right;
      padding: 0 8px 0 4px;
      color: var(--text-muted);
      user-select: none;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .conflict-code {
      flex: 1;
      white-space: pre;
      padding-right: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conflict-row.chg .conflict-code { color: var(--warn); }
    .conflict-row.add .conflict-code:last-child { color: var(--add); }
    .conflict-row.del .conflict-code:first-child { color: var(--del); }
    .conflict-compare-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .conflict-compare-path {
      font-family: var(--mono);
      font-size: 12px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conflict-compare-hint {
      padding: 8px 14px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      background: var(--bg-raised);
    }

    .conflict-compare-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding: 4px;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .conflict-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 34px;
      padding: 0 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, filter 0.12s;
    }
    .conflict-action-btn svg {
      flex-shrink: 0;
      opacity: 0.9;
    }
    .conflict-action-btn--resolve {
      background: linear-gradient(180deg, rgba(63, 185, 80, 0.24) 0%, rgba(63, 185, 80, 0.12) 100%);
      border-color: rgba(63, 185, 80, 0.42);
      color: #6ee7a0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 1px 8px rgba(63, 185, 80, 0.14);
    }
    .conflict-action-btn--resolve:hover {
      background: linear-gradient(180deg, rgba(63, 185, 80, 0.32) 0%, rgba(63, 185, 80, 0.18) 100%);
      border-color: rgba(63, 185, 80, 0.58);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 2px 12px rgba(63, 185, 80, 0.24);
      filter: brightness(1.04);
    }
    .editor-open-menu {
      position: relative;
      flex-shrink: 0;
    }
    .editor-open-split {
      display: inline-flex;
      align-items: stretch;
      height: 34px;
      border-radius: 7px;
      border: 1px solid rgba(78, 205, 196, 0.38);
      background: linear-gradient(180deg, rgba(78, 205, 196, 0.2) 0%, rgba(78, 205, 196, 0.1) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 1px 8px rgba(78, 205, 196, 0.12);
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .editor-open-split:hover,
    .editor-open-split.open {
      border-color: rgba(78, 205, 196, 0.55);
      background: linear-gradient(180deg, rgba(78, 205, 196, 0.28) 0%, rgba(78, 205, 196, 0.16) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 2px 12px rgba(78, 205, 196, 0.22);
    }
    .editor-open-main,
    .editor-open-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      border: none;
      background: transparent;
      color: #8ae8e2;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: background 0.12s;
    }
    .editor-open-main {
      padding: 0 12px 0 14px;
      white-space: nowrap;
    }
    .editor-open-main:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .editor-open-chevron {
      padding: 0 9px;
      border-left: 1px solid rgba(78, 205, 196, 0.28);
      min-width: 30px;
    }
    .editor-open-chevron:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .editor-open-chevron svg {
      opacity: 0.72;
      transition: transform 0.15s;
    }
    .editor-open-split.open .editor-open-chevron svg {
      transform: rotate(180deg);
    }
    .editor-open-label {
      white-space: nowrap;
    }
    .editor-open-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 200px;
      background: var(--bg-raised);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 6px;
      box-shadow: var(--shadow);
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .editor-open-item {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text);
      text-align: left;
      transition: background 0.1s;
    }
    .editor-open-item:hover,
    .editor-open-item.active {
      background: var(--bg-hover);
    }
    .editor-open-item-add {
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      margin-top: 4px;
      padding-top: 10px;
      border-radius: 0 0 6px 6px;
    }
    .editor-open-item-add:hover { color: var(--text); }
    .editor-settings { display: flex; flex-direction: column; gap: 16px; }
    .editor-settings-intro {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .editor-option-list { display: flex; flex-direction: column; gap: 6px; }
    .editor-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
      text-align: left;
      width: 100%;
    }
    .editor-option:hover { background: var(--bg-hover); }
    .editor-option.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-dim);
    }
    .editor-option-radio {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .editor-option.selected .editor-option-radio {
      border-color: var(--accent);
    }
    .editor-option.selected .editor-option-radio::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .editor-option-info { flex: 1; min-width: 0; }
    .editor-option-name { font-weight: 600; font-size: 13px; }
    .editor-option-exe {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .settings-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      padding: 4px;
      background: var(--bg-base);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      width: fit-content;
    }
    .settings-tab {
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: background 0.1s, color 0.1s;
    }
    .settings-tab:hover { color: var(--text); }
    .settings-tab.active {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .toast {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-raised);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 10px 16px;
      font-size: 12px;
      color: var(--text-secondary);
      box-shadow: var(--shadow);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 520px;
    }
    .toast strong { color: var(--text); font-weight: 500; }
    .toast code {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
    }

    .success-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px;
      text-align: center;
      gap: 16px;
    }
    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--add-bg);
      color: var(--add);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .success-panel h2 { font-size: 22px; font-weight: 600; }
    .success-panel p { color: var(--text-secondary); max-width: 400px; line-height: 1.7; }

    .repo-mgmt {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .repo-mgmt-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .search-input {
      flex: 1;
      max-width: 320px;
    }
    .repo-table { width: 100%; border-collapse: collapse; }
    .repo-table th {
      text-align: left;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }
    .repo-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .repo-table tr:hover td { background: var(--bg-hover); }
    .repo-table .actions { display: flex; gap: 4px; }
    .icon-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      color: var(--text-muted);
      transition: background 0.1s, color 0.1s;
    }
    .icon-btn:hover { background: var(--bg-active); color: var(--text); }
    .icon-btn.danger:hover { color: var(--danger); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal {
      background: var(--bg-base);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      width: 480px;
      max-width: 90vw;
      box-shadow: var(--shadow);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 { font-size: 16px; font-weight: 600; }
    .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .form-group input, .form-group select { width: 100%; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-hint { font-size: 11px; color: var(--text-muted); }

    .flow-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-muted);
    }
    .migrate-flow {
      display: flex;
      align-items: stretch;
      gap: 0;
      margin-bottom: 20px;
    }
    .migrate-node {
      flex: 1;
      padding: 16px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    .migrate-node-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .migrate-node-name { font-weight: 600; font-size: 15px; }
    .migrate-node-path {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .migrate-connector {
      display: flex;
      align-items: center;
      padding: 0 8px;
      color: var(--accent);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px;
      color: var(--text-muted);
      gap: 12px;
      text-align: center;
    }
    .empty-state p { font-size: 13px; line-height: 1.6; }
  </style>
</head>

  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
