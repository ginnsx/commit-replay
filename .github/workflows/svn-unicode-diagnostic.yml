name: 诊断 SVN 中文路径

on:
  workflow_dispatch:

jobs:
  probe:
    name: 在 ${{ matrix.os }} 验证
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-latest

    steps:
      - name: 安装 SVN 并显示环境
        shell: pwsh
        run: |
          choco install sliksvn --version=1.14.5 --no-progress --yes
          svn --version --quiet
          "ImageOS=$env:ImageOS"
          "ImageVersion=$env:ImageVersion"
          "Culture=$((Get-Culture).Name)"
          "SystemLocale=$((Get-WinSystemLocale).Name)"
          "PowerShellOutputEncoding=$([Console]::OutputEncoding.WebName)"
          chcp

      - name: 验证中文路径的添加、查询和提交
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-Svn {
            param([string[]] $Arguments)

            & svn @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "SVN 命令失败：svn $($Arguments -join ' ')"
            }
          }

          $root = Join-Path $env:RUNNER_TEMP "svn-unicode-$([guid]::NewGuid())"
          $repo = Join-Path $root "repo"
          $workingCopy = Join-Path $root "working-copy"
          $freshRoot = Join-Path $root "fresh-root"
          $freshDirect = Join-Path $root "fresh-direct"
          $freshTargets = Join-Path $root "fresh-targets"
          New-Item -ItemType Directory -Path $root | Out-Null

          & svnadmin create $repo
          if ($LASTEXITCODE -ne 0) {
            throw "创建 SVN 仓库失败"
          }

          $repoUri = [Uri]::new((Resolve-Path $repo).Path).AbsoluteUri.TrimEnd("/")
          $trunkUri = "$repoUri/trunk"
          Invoke-Svn -Arguments @("mkdir", $trunkUri, "-m", "initialize trunk")
          Invoke-Svn -Arguments @("checkout", $trunkUri, $workingCopy)

          $rootAddedPath = "src/中文-整体添加.txt"
          Push-Location $workingCopy
          try {
            New-Item -ItemType Directory -Path "src" | Out-Null
            [IO.File]::WriteAllText(
              (Join-Path $workingCopy $rootAddedPath),
              "中文内容`n",
              [Text.UTF8Encoding]::new($false)
            )

            # 先仅向 SVN 传递英文的当前目录，验证仓库本身能否保存中文路径。
            Invoke-Svn -Arguments @("add", "--force", ".")

            # 保留原始字节，用于区分 SVN 内部丢字与日志解码错误。
            $stdoutFile = Join-Path $root "status.stdout"
            $stderrFile = Join-Path $root "status.stderr"
            $svnExecutable = (Get-Command svn.exe).Source
            $statusProcess = Start-Process `
              -FilePath $svnExecutable `
              -ArgumentList @("status", "--ignore-externals") `
              -WorkingDirectory $workingCopy `
              -RedirectStandardOutput $stdoutFile `
              -RedirectStandardError $stderrFile `
              -Wait `
              -PassThru

            "svn status exit code: $($statusProcess.ExitCode)"
            "svn status text:"
            Get-Content -Raw $stdoutFile
            "svn status raw hex:"
            [Convert]::ToHexString([IO.File]::ReadAllBytes($stdoutFile))

            if ($statusProcess.ExitCode -ne 0) {
              Get-Content -Raw $stderrFile
              throw "查询 SVN 状态失败"
            }

            Invoke-Svn -Arguments @("commit", ".", "-m", "add unicode path from root")
          }
          finally {
            Pop-Location
          }

          Invoke-Svn -Arguments @("checkout", $trunkUri, $freshRoot)
          $rootVerified = Test-Path (Join-Path $freshRoot $rootAddedPath)

          # XML 输出按标准使用 UTF-8，用它与本地化的普通 diff 输出对比。
          $logXmlFile = Join-Path $root "log.xml"
          $logXmlError = Join-Path $root "log.stderr"
          $logProcess = Start-Process `
            -FilePath $svnExecutable `
            -ArgumentList @("log", "--xml", "-v", "-r", "2", $trunkUri) `
            -RedirectStandardOutput $logXmlFile `
            -RedirectStandardError $logXmlError `
            -Wait `
            -PassThru
          $logXmlText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($logXmlFile))
          $logXmlPreservesChinese = $logProcess.ExitCode -eq 0 -and $logXmlText.Contains("中文-整体添加.txt")
          "svn log XML preserves chinese: $logXmlPreservesChinese"
          $logXmlText

          $summaryXmlFile = Join-Path $root "diff-summary.xml"
          $summaryXmlError = Join-Path $root "diff-summary.stderr"
          $summaryProcess = Start-Process `
            -FilePath $svnExecutable `
            -ArgumentList @("diff", "--summarize", "--xml", "-c", "2", $trunkUri) `
            -RedirectStandardOutput $summaryXmlFile `
            -RedirectStandardError $summaryXmlError `
            -Wait `
            -PassThru
          $summaryXmlText = [Text.Encoding]::UTF8.GetString(
            [IO.File]::ReadAllBytes($summaryXmlFile)
          )
          $summaryXmlDecoded = [Uri]::UnescapeDataString($summaryXmlText)
          $summaryXmlPreservesChinese = `
            $summaryProcess.ExitCode -eq 0 -and `
            $summaryXmlDecoded.Contains("中文-整体添加.txt")
          "svn diff summary XML preserves chinese: $summaryXmlPreservesChinese"
          $summaryXmlText

          # 再把中文路径直接作为 SVN 参数，模拟应用当前的调用方式。
          $directPath = "src/中文-直接参数.txt"
          $directStatusExit = -1
          $directAddExit = -1
          $directVerified = $false
          $directFailure = ""

          Push-Location $workingCopy
          try {
            [IO.File]::WriteAllText(
              (Join-Path $workingCopy $directPath),
              "直接参数测试`n",
              [Text.UTF8Encoding]::new($false)
            )

            "direct status output:"
            & svn status $directPath
            $directStatusExit = $LASTEXITCODE
            "direct status exit code: $directStatusExit"

            "direct add output:"
            & svn add --parents $directPath
            $directAddExit = $LASTEXITCODE
            "direct add exit code: $directAddExit"

            if ($directAddExit -eq 0) {
              Invoke-Svn -Arguments @("commit", ".", "-m", "add unicode path directly")
            }
            else {
              $directFailure = "直接传递中文路径时 svn add 失败"
            }
          }
          catch {
            $directFailure = $_.Exception.Message
          }
          finally {
            Pop-Location
          }

          if ($directAddExit -eq 0 -and [string]::IsNullOrEmpty($directFailure)) {
            try {
              Invoke-Svn -Arguments @("checkout", $trunkUri, $freshDirect)
              $directVerified = Test-Path (Join-Path $freshDirect $directPath)
              if (-not $directVerified) {
                $directFailure = "直接添加看似成功，但重新检出后文件不存在"
              }
            }
            catch {
              $directFailure = $_.Exception.Message
            }
          }

          # 通过 ASCII 路径的目标文件传入 UTF-8 中文路径，避免直接命令行参数转换。
          $targetsPath = "src/中文-目标文件.txt"
          $targetsFile = Join-Path $root "targets-utf8.txt"
          [IO.File]::WriteAllText(
            $targetsFile,
            "$targetsPath`n",
            [Text.UTF8Encoding]::new($false)
          )
          [IO.File]::WriteAllText(
            (Join-Path $workingCopy $targetsPath),
            "目标文件测试`n",
            [Text.UTF8Encoding]::new($false)
          )

          $targetsAddExit = -1
          $targetsVerified = $false
          $targetsFailure = ""
          Push-Location $workingCopy
          try {
            "targets file add output:"
            & svn add --parents --targets $targetsFile
            $targetsAddExit = $LASTEXITCODE
            "targets file add exit code: $targetsAddExit"
            if ($targetsAddExit -eq 0) {
              Invoke-Svn -Arguments @("commit", ".", "-m", "add unicode path from targets file")
            }
            else {
              $targetsFailure = "UTF-8 目标文件无法添加中文路径"
            }
          }
          catch {
            $targetsFailure = $_.Exception.Message
          }
          finally {
            Pop-Location
          }

          if ($targetsAddExit -eq 0 -and [string]::IsNullOrEmpty($targetsFailure)) {
            try {
              Invoke-Svn -Arguments @("checkout", $trunkUri, $freshTargets)
              $targetsVerified = Test-Path (Join-Path $freshTargets $targetsPath)
              if (-not $targetsVerified) {
                $targetsFailure = "目标文件添加看似成功，但重新检出后文件不存在"
              }
            }
            catch {
              $targetsFailure = $_.Exception.Message
            }
          }

          @"
          ### SVN 中文路径诊断

          - 运行环境：${{ matrix.os }}
          - 整体添加并重新检出：$rootVerified
          - 日志 XML 保留中文：$logXmlPreservesChinese
          - 差异摘要 XML 保留中文：$summaryXmlPreservesChinese
          - 直接查询中文路径退出码：$directStatusExit
          - 直接添加中文路径退出码：$directAddExit
          - 直接添加并重新检出：$directVerified
          - UTF-8 目标文件添加退出码：$targetsAddExit
          - UTF-8 目标文件添加并重新检出：$targetsVerified
          - 直接传参失败原因：$directFailure
          - 目标文件失败原因：$targetsFailure
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

          if (-not $rootVerified) {
            throw "SVN 仓库无法保存或恢复中文路径"
          }
          if (-not $logXmlPreservesChinese -or -not $summaryXmlPreservesChinese) {
            throw "SVN XML 输出未保留中文路径"
          }

  regression:
    name: 在 ${{ matrix.os }} 运行中文路径迁移回归
    needs: probe
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 SVN
        shell: pwsh
        run: |
          choco install sliksvn --version=1.14.5 --no-progress --yes
          svn --version --quiet

      - name: 运行 SVN 单元检查
        working-directory: src-tauri
        run: cargo test vcs::svn

      - name: 运行完整迁移回归
        shell: pwsh
        run: npm run test:regression:release
