name: 发布 Relay

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: npm ci

      - name: 校验版本和签名配置
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($packageVersion -ne $tagVersion) {
            throw "发布标签 ${{ github.ref_name }} 与 package.json 版本 $packageVersion 不一致"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "缺少 TAURI_SIGNING_PRIVATE_KEY 保密配置"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PUBLIC_KEY)) {
            throw "缺少 TAURI_SIGNING_PUBLIC_KEY 仓库变量"
          }

      - name: 安装 SVN 回归依赖
        shell: pwsh
        run: choco install subversion --no-progress --yes

      - name: 前端检查
        run: |
          npm test
          npm run lint
          npm run format:check

      - name: Rust 检查
        working-directory: src-tauri
        run: |
          cargo test
          cargo clippy

      - name: 发布前迁移回归
        shell: pwsh
        run: npm run test:regression:release

      - name: 构建、签名并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Relay ${{ github.ref_name }}
          releaseBody: |
            本次更新重点改善迁移预览体验，并为 Windows 正式版加入应用内更新能力。

            ### 主要更新
            - 新增“关于和更新”页面，可检查、下载并安装新版本；发现更新时会在标题栏提示。
            - 优化执行摘要与文件预览的空间分配，支持收起摘要和专注预览，阅读代码更顺畅。
            - 加强跨版本差异分析与补丁回退，降低路径变化、内容漂移等场景下的迁移失败概率。
            - 自动识别已经中转的提交，保留必要的差异上下文，减少重复迁移。
            - 统一迁移生成的提交说明，便于追踪来源、版本和冲突处理情况。

            安装包适用于 Windows x64。应用内更新会在迁移任务完成后再执行，避免打断正在进行的操作。
          generateReleaseNotes: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis
