[package]
name = "copy-diff"
version = "0.1.0"
description = "Cross-VCS commit replay tool"
authors = []
edition = "2021"

[lib]
name = "copy_diff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"

quick-xml = { version = "0.37", features = ["serialize"] }
similar = "2"

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
